name: Setup Voice Agent & Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unpack Project Source Files
      run: |
        echo "Extracting all Voice Agent project source files..."
        python3 - << 'PYEOF'
        import base64, zipfile, io

        raw_b64 = """"""

        # Auto-clean whitespace/line breaks and auto-fix padding
        clean_b64 = "".join(raw_b64.split())
        missing_padding = len(clean_b64) % 4
        if missing_padding:
            clean_b64 += "=" * (4 - missing_padding)

        zip_data = base64.b64decode(clean_b64)
        with zipfile.ZipFile(io.BytesIO(zip_data)) as z:
            z.extractall('.')

        print("All project files extracted successfully!")
        PYEOF
        chmod +x gradlew

    - name: Commit files to repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add only project files (avoid touching .github)
        git add app/ gradle/ gradlew build.gradle.kts settings.gradle.kts README.md
        
        if git diff --staged --quiet; then
          echo "No new files to commit"
        else
          git commit -m "Add complete Voice Agent Android source files"
          git push origin HEAD:${{ github.ref_name }}
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoiceAgent-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
